<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-4">Inscrição para o Evento</h3>
                        <p class="text-muted text-center">Preencha seus dados para prosseguir para o pagamento.</p>
                        <form action="/checkout" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Nome Completo</label>
                                <input type="text" name="nome" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">WhatsApp</label>
                                <input type="text" name="telefone" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Ir para Pagamento (R$ 50,00)</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
